<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer ring - gamosa red -->
  <circle cx="100" cy="100" r="96" fill="#9E1B1E"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#D4A017" stroke-width="3"/>
  <!-- Inner white -->
  <circle cx="100" cy="100" r="78" fill="#FFFBEB" stroke="#D4A017" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Gamosa border pattern bottom -->
  <g>
    <rect x="32" y="148" width="136" height="10" fill="#9E1B1E"/>
    <rect x="32" y="148" width="136" height="2" fill="#D4A017"/>
    <rect x="32" y="156" width="136" height="2" fill="#D4A017"/>
    <g fill="#FFFBEB">
      <rect x="45" y="150" width="8" height="6"/>
      <rect x="65" y="150" width="8" height="6"/>
      <rect x="85" y="150" width="8" height="6"/>
      <rect x="105" y="150" width="8" height="6"/>
      <rect x="125" y="150" width="8" height="6"/>
      <rect x="145" y="150" width="8" height="6"/>
    </g>
  </g>
  <!-- Jaapi (Assamese hat) -->
  <g transform="translate(100 62)">
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="#D4A017" stroke="#7C2D12" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="32" ry="9" fill="#FEF3C7" stroke="#7C2D12" stroke-width="1.5"/>
    <line x1="0" y1="-32" x2="0" y2="-2" stroke="#7C2D12" stroke-width="1.5"/>
    <line x1="-20" y1="-24" x2="0" y2="-2" stroke="#7C2D12" stroke-width="1"/>
    <line x1="20" y1="-24" x2="0" y2="-2" stroke="#7C2D12" stroke-width="1"/>
    <line x1="-32" y1="-12" x2="0" y2="-2" stroke="#7C2D12" stroke-width="1"/>
    <line x1="32" y1="-12" x2="0" y2="-2" stroke="#7C2D12" stroke-width="1"/>
    <circle cx="0" cy="-34" r="4" fill="#9E1B1E" stroke="#D4A017" stroke-width="1.5"/>
  </g>
  <!-- Xorai (offering tray) -->
  <g transform="translate(100 108)">
    <ellipse cx="0" cy="18" rx="26" ry="6" fill="#D4A017" stroke="#7C2D12" stroke-width="2"/>
    <rect x="-4" y="0" width="8" height="18" fill="#D4A017" stroke="#7C2D12" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="#FEF3C7" stroke="#7C2D12" stroke-width="2"/>
    <ellipse cx="0" cy="-3" rx="18" ry="5" fill="#9E1B1E"/>
  </g>
  <!-- Text -->
  <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="15" fill="#7C2D12">ASSAM</text>
  <text x="100" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" letter-spacing="1.5" fill="#9E1B1E">ASSOCIATION • MZU</text>
</svg>
