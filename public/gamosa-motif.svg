    <rect x="78" y="78" width="44" height="44" transform="rotate(45 100 100)"/>
    <rect x="89" y="89" width="22" height="22" transform="rotate(45 100 100)"/>
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45 0 0)"/>
    <rect x="191" y="-9" width="18" height="18" transform="rotate(45 200 0)"/>
    <rect x="-9" y="191" width="18" height="18" transform="rotate(45 0 200)"/>
    <rect x="191" y="191" width="18" height="18" transform="rotate(45 200 200)"/>
  </g>
  <g fill="#9E1B1E" opacity="0.07">
    <circle cx="100" cy="100" r="4"/>
